<VirtualHost _default_:9443>
  ServerName login.nsbox.internal
  ProxyPreserveHost On
  ProxyPass         "/" "https://127.0.0.1:9992/"
  ProxyPassReverse  "/" "https://127.0.0.1:9992/"
  ProxyRequests     Off

  LogLevel    warn
  ErrorLog    logs/keycloak_error_log
  TransferLog logs/keycloak_access_log

  SSLEngine               on
  SSLProxyEngine          on
  SSLProxyVerify          none
  SSLProxyCheckPeerCN     off
  SSLProxyCheckPeerName   off
  SSLProxyCheckPeerExpire off
  SSLHonorCipherOrder     on
  SSLCipherSuite          PROFILE=SYSTEM
  SSLProxyCipherSuite     PROFILE=SYSTEM
  SSLCertificateFile      /certs/nsbox.crt
  SSLCertificateKeyFile   /certs/nsbox.key
</VirtualHost>
